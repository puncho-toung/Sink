// cr_capture_static.cfg - the static capture recipe of plans/camera-relative (00-PLAN.md 8.0,
// 01-VERIFY.md "The capture recipes", D26). Identity rows only (V1.0, V1.1, V1.2, V2.1): with
// g_stopTime 1 no portal sky view is drawn and no smoke is emitted.
//
// Copy to NecroGameBuild/base/ (with this tree's build, which has walkTics) and run one process,
// focused or on a nested display, the config backed up first (the ARCHIVE cvars below are saved),
// stdout to a log, under timeout -k 10:
//   RBDoom3BFG +set fs_basepath <...>/NecroGameBuild +set s_noSound 1 +set r_useValidationLayers 0
//              +set r_swapInterval 0 +set com_fixedTic 1 +set com_disableAutoSaves 1
//              +set r_useSSAO 0 +set ui_showGun 0 +set g_showHud 0 +set com_showFPS 0
//              +exec cr_capture_static.cfg
// s_noSound and r_useValidationLayers are read at init, so they only work on the command line.
// The archived cvars among the settings below (r_useSSAO, ui_showGun, g_showHud, com_showFPS,
// r_swapInterval) must also be passed as +set on the command line: the player profile load restores
// every archived cvar from the profile after this file has run (PlayerProfile.cpp, SetCVarsFromDict
// in idPlayerProfile::Serialize), and only the command line's +set values are re-applied after it
// (StartupVariable( NULL ) right after). Measured on Linux, 2026-10-22 (impl/BUILD-AND-G0.md).
//
// Maps, stock sources in NecroGameBuild/base/maps picked for WP-CRV:
//   sponza         the parallel sun, 28 env probes, a .lightgrid
//   tester         46 env probes, .shprobes, 5 spot lights, 12 shadowed lights
//   test_pbr_orbs  17 shadowed point lights, a .lightgrid
// No stock source map has a fog light. The fog volume is covered by maps/test/cr_origin and cr_far.
// Each view is the map's info_player_start at eye height facing its start angle.
//
// Per map, "walkTics 0 at 300 stop <name>" (GameVerify.cpp) sets g_stopTime 1 at the end of game tic
// 300 and queues the capture of that tic. It is keyed to the tic, not to a wait: the map load eats a
// varying part of the waits that follow "map". The first wait only has to cover the load and the
// positioning, which end well before tic 300. The second covers tic 300 and the capture, which then
// runs on the frozen state. Check the log, per map:
//   - the getviewpos line equals the target noted beside it (an unfocused window pauses the game and
//     a stale view would still compare equal, GD7),
//   - "walkTics: done at tic 300" and the dumpPose line after it read tic 300,
//   - "Wrote screenshots/cr_static_<map>.png".

set r_antiAliasing 0
set r_useTemporalAA 0
set r_taaJitter 0
set r_shadowMapRandomizeJitter 0
set r_useSSAO 0
set ui_showGun 0
set g_showHud 0
set com_showFPS 0		// the stats HUD (the user's config enables it) draws changing timings into the capture
set com_disableAutoSaves 1
set r_swapInterval 0
set com_fixedTic 1
set r_useLightScissors 3
set r_useMaskedOcclusionCulling 1
set r_useParallelAddModels 1
set r_useParallelAddLights 1
set r_useParallelAddShadows 1
set r_useScissor 1

// sponza
set g_stopTime 0
map sponza
walkTics 0 at 300 stop screenshots/cr_static_sponza
wait 150
noclip
setviewpos 6 336 88 270
wait 10
getviewpos			// target ( 6.00 336.00 88.25 ) 270.0
wait 400
dumpPose

// tester
set g_stopTime 0
map tester
walkTics 0 at 300 stop screenshots/cr_static_tester
wait 150
noclip
setviewpos 32 0 50 0
wait 10
getviewpos			// target ( 32.00 0.00 50.25 ) 0.0
wait 400
dumpPose

// test_pbr_orbs
set g_stopTime 0
map test_pbr_orbs
walkTics 0 at 300 stop screenshots/cr_static_test_pbr_orbs
wait 150
noclip
setviewpos 0 192 68 270
wait 10
getviewpos			// target ( 0.00 192.00 68.25 ) 270.0
wait 400
dumpPose

echo cr_capture_static done
