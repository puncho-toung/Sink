// cr_capture_live.cfg - the live capture recipe of plans/camera-relative (00-PLAN.md 8.0,
// 01-VERIFY.md "The capture recipes", D26): g_stopTime 0, a code-driven walk after the load, and the
// capture at a fixed game tic, so the portal sky view and smoke are live.
//
// One map per process. Copy to NecroGameBuild/base/ (with this tree's build, which has walkTics) and
// run, focused or on a nested display, the config backed up first, stdout to a log, under timeout -k 10:
//   RBDoom3BFG +set fs_basepath <...>/NecroGameBuild +set s_noSound 1 +set r_useValidationLayers 0
//              +set r_swapInterval 0 +set com_fixedTic 1 +set com_disableAutoSaves 1
//              +set r_useSSAO 0 +set ui_showGun 0 +set g_showHud 0 +set com_showFPS 0
//              +exec cr_capture_live.cfg +vstr cr_live_sponza
// (or cr_live_tester, cr_live_test_pbr_orbs) and stop the engine after the "Wrote" line of the capture.
// The archived cvars among the settings below (r_useSSAO, ui_showGun, g_showHud, com_showFPS,
// r_swapInterval) must also be passed as +set on the command line: the player profile load restores
// every archived cvar from the profile after this file has run (PlayerProfile.cpp, SetCVarsFromDict
// in idPlayerProfile::Serialize), and only the command line's +set values are re-applied after it
// (StartupVariable( NULL ) right after). Measured on Linux, 2026-10-22 (impl/BUILD-AND-G0.md).
//
// Maps and views as in cr_capture_static.cfg: sponza (the parallel sun, probes), tester (probes, spot
// lights), test_pbr_orbs (17 shadowed point lights). No stock source map has a fog light, a portal sky
// or a smoke source. The live sky and smoke rows run on maps/test/cr_sky and cr_subviews with the same
// block shape: setviewpos from maps/test/README.md, capture name of your choice.
//
// Each block arms "walkTics 60 forward at 400 <name>" right after "map": it walks the player 1 unit per
// tic on game tics 401 to 460 and queues the capture after tic 460, keyed to the tic and not to a wait,
// which the map load eats in varying part. The waits only cover the load and the positioning, which end
// before tic 400. Nothing may wait in the buffer while the walk runs, or it holds the capture back with
// it: that is why the walk ends the block and a process runs one map.
//
// Check the log: the getviewpos line equals the target in the block's comment below (GD7), one pose
// line per tic 401 to 460, "walkTics: done at tic 460", "Wrote screenshots/cr_live_<map>.png".
// Positive checks (GD1): a run with +set g_enablePortalSky 0 must capture a different image on a map
// with a portal sky, and smoke must have been emitted: the "walkTics: done" line is followed by
// the printSmokeCount line "smoke <tic> count <n> anchor ( x y z )" (WP-CR2); its count must be
// > 0 on cr_sky and cr_subviews.
// For a per-tic series (V2.2) use "walkTics 60 right at 400 every <name>" in the same place.

set r_antiAliasing 0
set r_useTemporalAA 0
set r_taaJitter 0
set r_shadowMapRandomizeJitter 0
set r_useSSAO 0
set ui_showGun 0
set g_showHud 0
set com_showFPS 0		// the stats HUD (the user's config enables it) draws changing timings into the capture
set com_disableAutoSaves 1
set r_swapInterval 0
set com_fixedTic 1
set r_useLightScissors 3
set r_useMaskedOcclusionCulling 1
set r_useParallelAddModels 1
set r_useParallelAddLights 1
set r_useParallelAddShadows 1
set r_useScissor 1
set g_stopTime 0

// getviewpos target ( 6.00 336.00 88.25 ) 270.0 at the walk's start
set cr_live_sponza "map sponza; walkTics 60 forward at 400 screenshots/cr_live_sponza; wait 150; noclip; setviewpos 6 336 88 270; wait 10; getviewpos"

// getviewpos target ( 32.00 0.00 50.25 ) 0.0
set cr_live_tester "map tester; walkTics 60 forward at 400 screenshots/cr_live_tester; wait 150; noclip; setviewpos 32 0 50 0; wait 10; getviewpos"

// getviewpos target ( 0.00 192.00 68.25 ) 270.0
set cr_live_test_pbr_orbs "map test_pbr_orbs; walkTics 60 forward at 400 screenshots/cr_live_test_pbr_orbs; wait 150; noclip; setviewpos 0 192 68 270; wait 10; getviewpos"
