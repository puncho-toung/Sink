// fogbench.cfg - package V6 ( row 180 ): the froxel fog's four quality levels timed on the owner's machine.
// Load a map, stand inside or facing a fog volume ( a fog light the froxel fog takes ), then type `exec fogbench` at the
// console and keep still for about 40 seconds. The haze of 1500 it sets is a stand-in that fills the whole fog grid: by
// V6's measure a fog volume of any size costs about what the haze costs ( every kernel runs over the whole grid, review
// F1-2 ), so the four levels' costs hold for a fog volume too. It writes four map-rows files under fs_savepath, in
// base/maprows ( on Windows under Saved Games; the console prints `MAP CSV opened:` with each path ): fogbench_qm1.csv,
// fogbench_q0.csv, fogbench_q1.csv and fogbench_q2.csv, the fog's six GPU zones a frame among them: send those four.
// At the end it sets the defaults ( quality -1, distance 0, zones 0 ), not the values set before it ran ( review F1-4 ).
set r_volumetricFog 1
set r_volumetricFogZones 1
set r_volumetricFogDistance 1500
set r_volumetricFogQuality -1
wait 200
set com_mapRowsLog fogbench_qm1
wait 400
set com_mapRowsLog ""
set r_volumetricFogQuality 0
wait 200
set com_mapRowsLog fogbench_q0
wait 400
set com_mapRowsLog ""
set r_volumetricFogQuality 1
wait 200
set com_mapRowsLog fogbench_q1
wait 400
set com_mapRowsLog ""
set r_volumetricFogQuality 2
wait 200
set com_mapRowsLog fogbench_q2
wait 400
set com_mapRowsLog ""
set r_volumetricFogQuality -1
set r_volumetricFogDistance 0
set r_volumetricFogZones 0
echo "fogbench: done; send save/base/maprows/fogbench_qm1.csv, fogbench_q0.csv, fogbench_q1.csv, fogbench_q2.csv"
